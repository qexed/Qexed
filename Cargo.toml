[workspace]
resolver = "3"
members = [
    "crates/qexed",
    "crates/qexed_club",
    # 配置核心
    "crates/qexed_config",
    "crates/qexed_toml",
    
    
    # Log
    "crates/qexed_log",

    # 多语言
    "crates/qexed_language",
    "crates/qexed_language_server",
    # 文档
    "crates/qexed_doc",
    "crates/macros/qexed_doc_macros",
    "crates/macros/qexed_config_macros",
    "crates/macros/qexed_error_macros",
    "crates/qexed_profiler",
    "crates/qexed_management",
    "crates/qexed_statistics",
    "crates/qexed_integrity",
    "crates/qexed_doc_to_mdx",

    # 文档示例校验（docker 复现 MDX verify 清单）
    "crates/qexed_doc_verify",

    # Mojang jar数据
    "crates/qexed_mojang_data",

    # 网络包与注册表
    "crates/qexed_packet",
    "crates/qexed_protocol",
    "crates/qexed_nbt",
    "crates/macros/qexed_packet_macros",

    # v4 全量迁移功能域
    "crates/qexed_world",
    "crates/qexed_play",
    "crates/qexed_entities",
    "crates/qexed_plugins",
    "crates/qexed_connection",
    "crates/qexed_player",
    "crates/qexed_server",
]
[workspace.dependencies]
qexed_toml.path = "crates/qexed_toml"
qexed_config.path = "crates/qexed_config"
qexed_log.path = "crates/qexed_log"
qexed_language.path = "crates/qexed_language"
qexed_doc.path = "crates/qexed_doc"
qexed_doc_macros.path = "crates/macros/qexed_doc_macros"
qexed_integrity.path = "crates/qexed_integrity"
qexed_statistics.path = "crates/qexed_statistics"
qexed_management.path = "crates/qexed_management"
qexed_profiler.path = "crates/qexed_profiler"
qexed_error_macros.path = "crates/macros/qexed_error_macros"
qexed_config_macros.path = "crates/macros/qexed_config_macros"
qexed_club = { path = 'crates/qexed_club' }
qexed_mojang_data.path = "crates/qexed_mojang_data"
qexed_packet.path = "crates/qexed_packet"
qexed_protocol.path = "crates/qexed_protocol"
qexed_nbt.path = "crates/qexed_nbt"
qexed_packet_macros.path = "crates/macros/qexed_packet_macros"

qexed_world.path = "crates/qexed_world"
qexed_play.path = "crates/qexed_play"
qexed_entities.path = "crates/qexed_entities"
qexed_plugins.path = "crates/qexed_plugins"
qexed_connection.path = "crates/qexed_connection"
qexed_player.path = "crates/qexed_player"
qexed_server.path = "crates/qexed_server"

serde = "1.0.229"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.20"
tokio = "1.53.1"
toml_edit = "0.25.13"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

shadow-rs = "2.0.0"
chrono = "0.4.45"
colored = "3.1.1"
tklog = "0.3.0"
anyhow = "1.0.104"
log = "0.4.34"

bytes = "1.11"
uuid = { version = "1.17", features = ["v3", "v4", "serde"] }
byteorder = "1.5"
flate2 = "1.1"
libloading = "0.9"
rayon = "1.11"
rand = "0.8"
tokio-tungstenite = "0.28"
futures-util = "0.3"
mongodb = "3.4.1"
mysql_async = "0.36.1"
redis = { version = "1.0.2", features = ["tokio-comp"] }
tokio-stream = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cfb8 = { version = "0.8.1", features = ["std"] }
openssl = { version = "0.10", features = ["vendored"] }
sha1 = "0.10"
inventory = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"