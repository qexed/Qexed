[workspace]
resolver = "3"
members = [
    "crates/qexed",
    "crates/qexed_log",
    "crates/qexed_update_check",
    "crates/qexed_config",
    "crates/qexed_safe_check",
    "crates/plugin/qexed_plugin_manage",
    "crates/qexed_warden",
    "crates/qexed_ip_connection_speed_test",
    "crates/macros/qexed_config_macros",
    "crates/plugin/qexed_wasm_runtime",
    "crates/plugin/hello_world",
    "crates/plugin/hello_hello_world",
    "crates/plugin/qexed_plugin_api",
    "crates/qexed_packet_split",
    "crates/qexed_tcp_connect",
    "crates/packet/qexed_packet",
    "crates/packet/qexed_protocol",
    "crates/macros/qexed_packet_macros",
    "crates/qexed_nbt",
    "crates/qexed_players"
]
[workspace.dependencies]
# 内部包
qexed_log.path = "crates/qexed_log"
qexed_update_check.path = "crates/qexed_update_check"
qexed_config.path = "crates/qexed_config"
qexed_safe_check.path = "crates/qexed_safe_check"
qexed_config_macros.path = "crates/macros/qexed_config_macros"
qexed_plugin_manage.path = "crates/plugin/qexed_plugin_manage"
qexed_warden.path = "crates/qexed_warden"
qexed_ip_connection_speed_test.path = "crates/qexed_ip_connection_speed_test"
qexed_wasm_runtime.path = "crates/plugin/qexed_wasm_runtime"
qexed_plugin_api.path = "crates/plugin/qexed_plugin_api"
qexed_packet_split.path = "crates/qexed_packet_split"
qexed_tcp_connect.path = "crates/qexed_tcp_connect"
qexed_packet.path = "crates/packet/qexed_packet"
qexed_protocol.path = "crates/packet/qexed_protocol"
qexed_packet_macros.path = "crates/macros/qexed_packet_macros"
qexed_nbt.path = "crates/qexed_nbt"
qexed_players.path = "crates/qexed_players"
# 插件
# pass
# 外部包
thiserror = "1.0"
anyhow = "1.0"                                         # 用于简化错误处理
byteorder = "1.5.0"
