[workspace]
resolver = "3"
members = [
    "crates/qexed",
    "crates/qexed_club",
    # 配置核心
    "crates/qexed_config",
    "crates/qexed_toml",
    
    
    # Log
    "crates/qexed_log",

    # 多语言
    "crates/qexed_language",
    "crates/qexed_language_server",
    # 文档
    "crates/qexed_doc",
    "crates/macros/qexed_doc_macros",
    "crates/macros/qexed_config_macros",
    "crates/macros/qexed_packet_macros",
    "crates/qexed_doc_to_mdx",

    # 文档示例校验（docker 复现 MDX verify 清单）
    "crates/qexed_doc_verify",

    # Mojang jar数据
    "crates/qexed_mojang_data",



    # NBT
    "crates/qexed_nbt",
    "crates/qexed_protocol",
    "crates/qexed_packet",
    "crates/qexed_anvil",
    "crates/qexed_forge",
    "crates/qexed_server",
    # 连接层旧实现（login/configuration/play 状态机），registry 同步已迁到 mojang 缓存
    "crates/qexed_server_old",
    "crates/qexed_registry",
    "crates/qexed_tcp_connect",
    "crates/qexed_auth",
    "crates/qexed_chat",
]
[workspace.dependencies]
qexed_chat.path = "crates/qexed_chat"
qexed_auth.path = "crates/qexed_auth"
qexed_tcp_connect.path = "crates/qexed_tcp_connect"
qexed_registry.path = "crates/qexed_registry"
qexed_anvil.path = "crates/qexed_anvil"
qexed_forge.path = "crates/qexed_forge"
qexed_server.path = "crates/qexed_server"
qexed_packet.path = "crates/qexed_packet"
qexed_protocol.path = "crates/qexed_protocol"
qexed_nbt.path = "crates/qexed_nbt"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
byteorder = "1"
bytes = "1"
qexed_toml.path = "crates/qexed_toml"
qexed_config = { path = "crates/qexed_config", features = ["global-root"] }
qexed_log.path = "crates/qexed_log"
qexed_language.path = "crates/qexed_language"
qexed_doc.path = "crates/qexed_doc"
qexed_doc_macros.path = "crates/macros/qexed_doc_macros"
qexed_config_macros.path = "crates/macros/qexed_config_macros"
qexed_packet_macros.path = "crates/macros/qexed_packet_macros"
qexed_club = { path = 'crates/qexed_club' }
qexed_mojang_data.path = "crates/qexed_mojang_data"
qexed_server_legacy.path = "crates/qexed_server_old"

serde = "1.0.229"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.20"
tokio = "1.53.1"
toml_edit = "0.25.13"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"

shadow-rs = "2.0.0"
chrono = "0.4.45"
colored = "3.1.1"
tklog = "0.3.0"
anyhow = "1.0.104"
log = "0.4.34"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
openssl = "0.10.81"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zip = { version = "2.4", default-features = false }
async-stream = "0.3.6"
tokio-stream = "0.1.19"
