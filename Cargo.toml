[workspace]
resolver = "3"
members = [
    "crates/qexed",
    "crates/qexed-club",
    # 配置文件
    "crates/qexed_config",
    "crates/qexed_toml",
    "crates/macros/qexed_config_macros",
]
[workspace.dependencies]
qexed_toml.path = "crates/qexed_toml"
qexed_config.path = "crates/qexed_config"
qexed_config_macros.path = "crates/macros/qexed_config_macros"
serde = "1.0.229"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.20"
tokio = "1.53.1"
toml_edit = "0.25.13"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
