name: Dispatch website docs update

on:
  push:
    branches:
      - v4

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website docs update
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/qexed/qexed-website/dispatches \
            --method POST \
            --field event_type=qexed-updated \
            --raw-field client_payload="{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}"
