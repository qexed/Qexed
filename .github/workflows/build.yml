name: Build for Linux, Windows, and macOS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch: # 允许手动触发

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # 设置统一的构建目录，便于缓存配置
  CARGO_TARGET_DIR: target-ci

jobs:
  multi-platform-build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    
    # 核心：定义构建矩阵
    strategy:
      matrix:
        include:
          # Linux 配置
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: qexed-linux
            artifact_path: target-ci/x86_64-unknown-linux-gnu/release/qexed
            
          # Windows 配置
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: qexed-windows.exe
            artifact_path: target-ci/x86_64-pc-windows-msvc/release/qexed.exe
            vcpkg_root: ${{ github.workspace }}\vcpkg
            
          # macOS 配置
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: qexed-macos
            artifact_path: target-ci/x86_64-apple-darwin/release/qexed

    steps:
    # 第一步：检出代码
    - name: Checkout code and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # 第二步：各平台特有的依赖安装
    - name: Install Linux dependencies (OpenSSL)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Set up vcpkg and install OpenSSL (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # 克隆 vcpkg
        git clone https://github.com/Microsoft/vcpkg.git ${{ matrix.vcpkg_root }}
        & "${{ matrix.vcpkg_root }}\bootstrap-vcpkg.bat"
        # 安装 OpenSSL
        & "${{ matrix.vcpkg_root }}\vcpkg" install openssl:x64-windows
        # 设置环境变量
        echo "VCPKG_ROOT=${{ matrix.vcpkg_root }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_ROOT_DIR=${{ matrix.vcpkg_root }}\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install macOS dependencies (OpenSSL)
      if: matrix.os == 'macos-latest'
      run: |
        brew install openssl pkg-config
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV

    # 第三步：设置 Rust 环境
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    # 第四步：配置缓存（加速后续构建）
    - name: Cache cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ env.CARGO_TARGET_DIR }}
        key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ matrix.os }}-cargo-

    # 第五步：执行构建
    - name: Build the project
      run: cargo build --release --target ${{ matrix.target }} --package qexed

    # 第六步：上传构建产物
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-${{ github.sha }}
        path: ${{ matrix.artifact_path }}
        retention-days: 7

  # 可选：汇总所有产物的作业
  combine-release:
    name: Create Combined Release
    needs: multi-platform-build
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: downloaded-artifacts

    - name: Create checksums and assemble
      run: |
        mkdir -p release-assets
        # 移动所有文件
        find downloaded-artifacts -type f -exec cp {} release-assets/ \;
        # 生成校验和
        cd release-assets
        sha256sum * > SHA256SUMS.txt
        echo "=== 最终发布包内容 ==="
        ls -la

    - name: Upload combined release
      uses: actions/upload-artifact@v4
      with:
        name: qexed-combined-release-${{ github.sha }}
        path: release-assets/