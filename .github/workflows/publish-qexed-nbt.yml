# Publish ONLY the qexed_nbt crate to crates.io when its version changes.
# 使用 Trusted Publishing（OIDC），无需在 GitHub Secrets 存放长期 API token。
#
# ── 一次性设置（Trusted Publishing 不支持创建新 crate，首次发布须手动）──
# 1. [已完成] qexed_nbt 0.1.0 已手动发布
# 2. 到 crates.io 该 crate 页面 → Settings → Trusted Publishing → Add:
#      Repository owner:  qexed
#      Repository name:   Qexed
#      Workflow filename: publish-qexed-nbt.yml   <- 必须与本文件名完全一致
#      Environment:       （留空，除非你在仓库里配置了 environment）
#
# ── 本地验证（不会真正上传）────────────────────────────────────────────
#   cargo publish --dry-run -p qexed_nbt --registry crates-io --allow-dirty
#
# ── 触发条件（全部满足才发布）─────────────────────────────────────────
#   1. push 到 main 分支
#   2. crates/qexed_nbt/Cargo.toml 的 version 字段发生变化
#   3. 该版本在 crates.io 上不存在（重复版本会跳过而不是失败）

name: Publish qexed_nbt

on:
  push:
    branches: [main]
    paths:
      - "crates/qexed_nbt/**"
      - ".github/workflows/publish-qexed-nbt.yml"
  workflow_dispatch:

# contents: write  -> push 版本 tag
# id-token: write  -> OIDC 令牌交换（Trusted Publishing 必需）
permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish qexed_nbt to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # v6 是 main 上的旧 tag，必须 fetch 全部历史 + tags 才能做版本对比
      - name: Fetch full history with tags
        run: git fetch --prune --unshallow --tags || git fetch --prune --tags

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Check if qexed_nbt version changed
        id: version
        run: |
          PREVIOUS_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          # workflow_dispatch 或首次 push 时没有 before SHA，退化为上次成功 tag
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -z "$PREVIOUS_SHA" ]; then
              echo "No previous commit available, skipping version comparison."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Comparing $PREVIOUS_SHA..$CURRENT_SHA for crates/qexed_nbt/Cargo.toml version"

          OLD_VERSION=$(git show "$PREVIOUS_SHA:crates/qexed_nbt/Cargo.toml" 2>/dev/null \
            | grep -E '^version\s*=' | head -1 | sed 's/version\s*=\s*"\(.*\)"/\1/')
          NEW_VERSION=$(grep -E '^version\s*=' crates/qexed_nbt/Cargo.toml \
            | head -1 | sed 's/version\s*=\s*"\(.*\)"/\1/')

          echo "old=$OLD_VERSION new=$NEW_VERSION"
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Failed to parse version from crates/qexed_nbt/Cargo.toml"
            exit 1
          fi

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($NEW_VERSION), nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version exists on crates.io
        id: cratesio
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          echo "Checking https://crates.io/api/v1/crates/qexed_nbt/$VERSION"
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/qexed_nbt/$VERSION" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "qexed_nbt @ $VERSION already exists on crates.io, skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.version.outputs.changed == 'true' && steps.cratesio.outputs.exists != 'true'
        run: cargo test -p qexed_nbt

      # Trusted Publishing: OIDC 令牌换取 30 分钟有效的临时发布 token
      # （action 的 post 阶段会自动吊销该 token，无需任何 GitHub Secret）
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: steps.version.outputs.changed == 'true' && steps.cratesio.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish qexed_nbt
        if: steps.version.outputs.changed == 'true' && steps.cratesio.outputs.exists != 'true'
        run: cargo publish -p qexed_nbt
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create version tag
        if: steps.version.outputs.changed == 'true' && steps.cratesio.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          TAG="qexed_nbt-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Publish workflow failed. Check logs above for details."
          echo "If auth failed (403), check the crates.io Trusted Publishing config:"
          echo "  - Repository owner/name: qexed / Qexed"
          echo "  - Workflow filename: publish-qexed-nbt.yml (must match exactly)"
          echo "  - Environment field: empty (we don't use a GH environment)"
          echo "Also confirm this job keeps 'id-token: write' permission."
