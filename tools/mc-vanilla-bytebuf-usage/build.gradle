import org.gradle.api.file.FileCollection
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.Internal
import org.gradle.process.CommandLineArgumentProvider

/** CLI args for the golden sampler. */
class GoldenCliArgs implements CommandLineArgumentProvider {
    @Internal
    File outDir

    @InputFiles
    FileCollection jars

    @Override
    Iterable<String> asArguments() {
        def argv = ["--out", outDir.absolutePath]
        jars.each { f -> argv += ["--jar", f.absolutePath] }
        return argv
    }
}

/** CLI args for the NBT usage extractor. */
class NbtCliArgs implements CommandLineArgumentProvider {
    @Internal
    File outDir

    @Input
    String mcVersion

    @InputFiles
    FileCollection jars

    @Override
    Iterable<String> asArguments() {
        def argv = ["--out", outDir.absolutePath, "--mc-version", mcVersion]
        jars.each { f -> argv += ["--jar", f.absolutePath] }
        return argv
    }
}

/** CLI args for the packet-structure extractor. */
class PacketStructCliArgs implements CommandLineArgumentProvider {
    @Internal
    File outDir

    @Input
    String mcVersion

    @Input
    @org.gradle.api.tasks.Optional
    String packetsJson

    @InputFiles
    FileCollection jars

    @Override
    Iterable<String> asArguments() {
        def argv = ["--out", outDir.absolutePath, "--mc-version", mcVersion]
        if (packetsJson != null && new File(packetsJson).isFile()) {
            argv += ["--packets-json", packetsJson]
        }
        jars.each { f -> argv += ["--jar", f.absolutePath] }
        return argv
    }
}

/** Supplies extractor CLI args from properly annotated properties. */
class ByteBufCliArgs implements CommandLineArgumentProvider {
    @Internal
    File outDir

    @Input
    String target

    @Input
    String mcVersion

    @InputFiles
    FileCollection jars

    @Override
    Iterable<String> asArguments() {
        def argv = ["--out", outDir.absolutePath, "--target", target, "--mc-version", mcVersion]
        jars.each { f -> argv += ["--jar", f.absolutePath] }
        return argv
    }
}

plugins {
    id 'java'
    id("org.spongepowered.gradle.vanilla") version "0.3.2"
}

group = 'cn.qexed'
version = '1.0-SNAPSHOT'

// Minecraft version is parametrized so this tool stays generic across upgrades:
//   gradle extractFriendlyByteBufUsage -PmcVersion=26.3
def mcVersion = providers.gradleProperty("mcVersion").orElse("26.3").get()

if (providers.gradleProperty("qexedSmokeBuildDir").isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty("qexedSmokeBuildDir").get()))
}

minecraft {
    version(mcVersion)
    runs {
        server()
        client() {
            args("--quickPlayMultiplayer", providers.gradleProperty("qexedQuickPlay").orElse("127.0.0.1:25565").get())
        }
    }
}

// Extra repositories for the tool's own libraries (ASM bytecode analyzer, Jackson).
repositories {
    mavenCentral()
}

dependencies {
    // The Minecraft jar is ONLY obtained through Gradle's external dependency
    // resolution (the VanillaGradle-provided "minecraft" configuration). The
    // extractor never looks for caches or downloads anything itself.
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    maxHeapSize = "2g"
}

// Diagnostic: shows which artifact Gradle resolved for the Minecraft dependency.
tasks.register("printMcArtifact") {
    group = "help"
    doLast {
        def files = configurations.minecraft
        println "minecraft configuration resolved artifacts:"
        files.each { println "  " + it }
    }
}

// Core task of this project: extract every FriendlyByteBuf (net.minecraft.network)
// method definition plus every call site / method reference from the vanilla jar.
tasks.register("extractFriendlyByteBufUsage", JavaExec) {
    description = "Extracts FriendlyByteBuf method definitions and all call sites from the vanilla jar."
    group = "verification"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "cn.qexed.bytebuf.ByteBufUsageExtractor"
    jvmArgs "-Xmx3g"
    workingDir rootProject.projectDir
    dependsOn tasks.named("compileJava")
    argumentProviders.add(new ByteBufCliArgs(
            outDir: layout.buildDirectory.dir("bytebuf-usage").get().asFile,
            target: providers.gradleProperty("bytebufTarget").orElse("net.minecraft.network.FriendlyByteBuf").get(),
            mcVersion: mcVersion,
            jars: configurations.minecraft))
}

tasks.register("extractPacketStructures", JavaExec) {
    description = "Extracts per-packet wire structures (ordered fields) from the vanilla jar."
    group = "verification"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "cn.qexed.bytebuf.PacketStructureExtractor"
    jvmArgs "-Xmx3g"
    workingDir rootProject.projectDir
    dependsOn tasks.named("compileJava")
    argumentProviders.add(new PacketStructCliArgs(
            outDir: layout.buildDirectory.dir("packet-structures").get().asFile,
            mcVersion: mcVersion,
            packetsJson: providers.gradleProperty("packetsJson")
                    .orElse(rootProject.projectDir.parentFile.toPath()
                            .resolve("mc-vanilla-protocol/build/vanilla-reports/reports/packets.json")
                            .toFile().absolutePath).get(),
            jars: configurations.minecraft))
}

tasks.register("extractNbtUsage", JavaExec) {
    description = "Extracts every NBT-touching method (readNbt/writeNbt/CompoundTag builders) from the vanilla jar."
    group = "verification"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "cn.qexed.bytebuf.NbtUsageExtractor"
    jvmArgs "-Xmx3g"
    workingDir rootProject.projectDir
    dependsOn tasks.named("compileJava")
    argumentProviders.add(new NbtCliArgs(
            outDir: layout.buildDirectory.dir("nbt-usage").get().asFile,
            mcVersion: mcVersion,
            jars: configurations.minecraft))
}

tasks.register("generateGoldenSamples", JavaExec) {
    description = "Generates golden wire samples by decoding random bytes with VANILLA codecs and re-encoding."
    group = "verification"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "cn.qexed.bytebuf.RandomPacketSampler"
    jvmArgs "-Xmx3g"
    workingDir rootProject.projectDir
    dependsOn tasks.named("compileJava")
    argumentProviders.add(new GoldenCliArgs(
            outDir: layout.buildDirectory.dir("golden-samples").get().asFile,
            jars: configurations.minecraft))
}

tasks.register("buildQexedForIntegration", Exec) {
    workingDir = rootProject.projectDir.parentFile.parentFile
    if (providers.gradleProperty("qexedTargetDir").isPresent()) {
        environment "CARGO_TARGET_DIR", providers.gradleProperty("qexedTargetDir").get()
    }
    commandLine "cargo", "build", "-p", "qexed"
}

tasks.register("buildWasmPluginsForIntegration", Exec) {
    workingDir = rootProject.projectDir.parentFile.parentFile
    commandLine "cargo", "build", "--manifest-path", "plugins/examples/Cargo.toml",
            "--target", "wasm32-unknown-unknown", "--release"
}

tasks.register("integrationTest", Test) {
    description = "Runs Qexed single-server vanilla protocol integration tests."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "integration"
    }
    dependsOn tasks.named("buildQexedForIntegration"), tasks.named("buildWasmPluginsForIntegration")
    shouldRunAfter tasks.named("test")
    systemProperty "qexed.repoRoot", rootProject.projectDir.parentFile.parentFile.absolutePath
    if (providers.gradleProperty("qexedTargetDir").isPresent()) {
        systemProperty "qexed.binary", file("${providers.gradleProperty("qexedTargetDir").get()}/debug/qexed.exe").absolutePath
    }
    if (providers.gradleProperty("qexedPort").isPresent()) {
        systemProperty "qexed.port", providers.gradleProperty("qexedPort").get()
    }
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.named("test") {
    useJUnitPlatform {
        excludeTags "integration"
    }
}