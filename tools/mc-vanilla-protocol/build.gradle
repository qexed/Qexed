plugins {
    id 'java'
    id("org.spongepowered.gradle.vanilla") version "0.3.2"
}

group = 'cn.qexed'
version = '1.0-SNAPSHOT'

if (providers.gradleProperty("qexedSmokeBuildDir").isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty("qexedSmokeBuildDir").get()))
}

minecraft {
    version("26.1.2")
    runs {
        server()
        client() {
            args("--quickPlayMultiplayer", "127.0.0.1:25565")
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    useJUnitPlatform()
}

tasks.register("buildQexedForIntegration", Exec) {
    workingDir = rootProject.projectDir.parentFile.parentFile
    commandLine "cargo", "build", "-p", "qexed"
}

tasks.register("integrationTest", Test) {
    description = "Runs Qexed single-server vanilla protocol integration tests."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags "integration"
    }
    dependsOn tasks.named("buildQexedForIntegration")
    shouldRunAfter tasks.named("test")
    systemProperty "qexed.repoRoot", rootProject.projectDir.parentFile.parentFile.absolutePath
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.named("test") {
    useJUnitPlatform {
        excludeTags "integration"
    }
}
