[package]
name = "qexed_config_macros"
version = "0.1.1"
edition = "2024"
description = "Proc-macro attribute #[app_config(PATH, NAME)] that implements qexed_config::Config for a struct, deriving SECRETS from <Secret>/<Secrets> autodoc tags."
license = "MIT"
readme = "README.md"
repository = "https://github.com/qexed/Qexed"
keywords = ["config", "proc-macro", "macro", "toml", "qexed"]
categories = ["config", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
serde.workspace = true
qexed_config.workspace = true
