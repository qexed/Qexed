[package]
name = "qexed_mojang_data"
version = "0.1.0"
edition = "2024"

[dependencies]
qexed_config.workspace = true
qexed_config_macros.workspace = true
qexed_language.workspace = true
qexed_doc.workspace = true
qexed_doc_macros.workspace = true

tokio = { workspace = true, features = ["rt", "macros"] }
tklog.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
log = { workspace = true, features = ["alloc"] }

reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
tar = { workspace = true }
flate2 = { workspace = true }
