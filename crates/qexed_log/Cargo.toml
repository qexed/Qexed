[package]
name = "qexed_log"
version = "0.1.0"
edition = "2024"
[package.metadata.log_defaults]
level = "Info"
console = true
formatter = "[{module}] {level} {time} {file} {message}\n"
file_path = "./logs/{}.log"
file_mode = "DAY"
keep_days = 7
max_size = 10
append = true
[package.metadata.log_modules]
qexed_tcp_connect.rename = "Tcp 连接"
qexed_log.rename = "日志"
qexed_update_check.rename ="更新检查"
qexed.rename = "主程序"

[dependencies]
colored = "3.1.1"
log = { workspace = true }
tklog = { workspace = true }
tokio = { workspace = true }
[build-dependencies]
chrono.workspace = true
serde.workspace = true
toml.workspace = true
