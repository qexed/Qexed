_fallback_language: zh-CN
_version: 2
autodoc:
  header:
    en: |-
      # Official documentation: https://doc.qexed.com/docs/autodoc/
      # Do not modify fields prefixed with auto_doc_system_
      # Example: auto_doc_system_lang
      # These settings are used for automatically updating the language-specific comments in the config file.
      # However, you can modify fields prefixed with auto_doc_setting_
      # auto_doc_setting_lang: The language for the current file; if empty, the global language is used
      # auto_doc_setting_enable: Enable the AutoDoc feature, which can automatically update comments for fields based on language, version, etc., as well as optional value information
      # Comments below "=======================" will not be modified by the system.
      # Comments above "=======================" will be modified by the system. Please do not edit them.
    zh-CN: |-
      # 官方文档：https://doc.qexed.com/docs/autodoc/
      # 请不要修改 auto_doc_system_ 开头的字段
      # 例如: auto_doc_system_lang
      # 这些设置是用于自动更新配置文件语言自动注释的
      # 但是您可以修改 auto_doc_setting_ 开头的字段
      # auto_doc_setting_lang:当前文件独立语言,若为空则使用全局语言
      # auto_doc_setting_enable:启用AutoDoc功能，该功能可自动为字段根据语言、版本等信息更新注释,以及可选的值等信息
      # 在 "=======================" 下面的注释都不会被系统修改
      # 但是在 "=======================" 上面的注释都会被系统修改，请不要修改
  header-init-example:
    en: |-
      # For example, you can freely modify the content of this line,
      # continue with line breaks,
      # as long as you don't write within AutoDoc and AutoDocHeader blocks.
    zh-CN: |-
      # 例如这一行的内容你就随意修改,
      # 你也可以继续换行等,
      # 只要不是在 AutoDoc 和 AutoDocHeader 中写就行了
  danger:
    en: "DANGER: \n%{text}"
    zh-CN: "高危警告：\n%{text}"
  warning:
    en: "WARNING: \n%{text}"
    zh-CN: "警告：\n%{text}"
  pending_deprecated:
    en: "Pending deprecation: \n%{text}"
    zh-CN: "即将弃用：\n%{text}"
  deprecated:
    en: "Deprecated: \n%{text}"
    zh-CN: "已被弃用：\n%{text}"
  migration:
    en: "Migration notice: \n%{text}"
    zh-CN: "迁移建议：\n%{text}"

  file_description:
    default:
      en: "%{file}: configuration file."
      zh-CN: "%{file}: 配置文件。"
    world:
      en: "%{file}: world save, generator, spawn, lighting, and GPU calculation settings."
      zh-CN: "%{file}: 世界存档、生成器、出生点、光照和 GPU 计算设置。"
    qexed:
      main:
        en: "%{file}: Qexed main configuration. Keeps global switches; runtime modules are separate qexed_* app config files."
        zh-CN: "%{file}: Qexed 主配置。用于全局开关；运行时模块拆分为独立的 qexed_* 应用配置文件。"
      plugin_download:
        en: "%{file}: plugin download source and authentication settings."
        zh-CN: "%{file}: 插件下载源和认证设置。"
      server:
        en: "%{file}: core server runtime, network, proxy, rate-limit, MOTD, and favicon settings."
        zh-CN: "%{file}: 核心服务端运行、网络、代理、速率限制、MOTD 和图标设置。"
      content_filter:
        en: "%{file}: chat content filter engine, word list, and external API settings."
        zh-CN: "%{file}: 聊天内容审核引擎、词库和外部 API 设置。"
      entities:
        en: "%{file}: static non-NPC entity, hologram, spawning, and AI configuration."
        zh-CN: "%{file}: 静态非 NPC 实体、悬浮字、刷怪和 AI 配置。"
      npc:
        en: "%{file}: NPC definitions and non-plugin NPC click actions."
        zh-CN: "%{file}: NPC 定义和非插件 NPC 点击动作配置。"
      entity_rendering:
        en: "%{file}: per-viewer entity render distance and entity stacking settings."
        zh-CN: "%{file}: 按玩家视角的实体渲染距离和实体堆叠显示设置。"
      lan_discovery:
        en: "%{file}: Minecraft LAN discovery broadcast settings."
        zh-CN: "%{file}: Minecraft 局域网发现广播设置。"
      lobby:
        en: "%{file}: lobby mode, backend selector, navigator item, broadcasts, and boss bar settings."
        zh-CN: "%{file}: 大厅模式、后端选择器、导航器物品、广播和 BossBar 设置。"
      menus:
        en: "%{file}: inventory hotbar and chest menu definitions."
        zh-CN: "%{file}: 物品栏快捷菜单和箱子菜单定义。"
      permissions:
        en: "%{file}: local or LuckPerms permission backend settings."
        zh-CN: "%{file}: 本地权限或 LuckPerms 权限后端设置。"
      placeholders:
        en: "%{file}: text placeholder formatting settings."
        zh-CN: "%{file}: 文本占位符格式化设置。"
      player_audit:
        en: "%{file}: player action audit switches and storage settings."
        zh-CN: "%{file}: 玩家行为审计开关和存储设置。"
      player_data:
        en: "%{file}: player data persistence engine and database connection settings."
        zh-CN: "%{file}: 玩家数据持久化引擎和数据库连接设置。"
      player_messages:
        en: "%{file}: player join and leave announcement templates."
        zh-CN: "%{file}: 玩家进服和退服提示模板。"
      resource_pack:
        en: "%{file}: server resource pack delivery and object storage settings."
        zh-CN: "%{file}: 服务端资源包下发和对象存储设置。"
      scoreboard:
        en: "%{file}: sidebar scoreboard objective, title, and line settings."
        zh-CN: "%{file}: 侧边栏计分板目标、标题和行内容设置。"

qexed_config:
  config:
    server:
      motd1:
        en: "Welcome to Qexed"
        zh-CN: "欢迎使用 Qexed"
      motd2:
        en: "MC server based on Rust"
        zh-CN: "基于Rust的MC服务端"

config:
  qexed:
    version:
      en: "Configuration version"
      zh-CN: "配置版本"
    update_check:
      en: "Enable update checks"
      zh-CN: "启用更新检查"
    language:
      en: "Runtime language. Defaults to detected system locale; falls back to zh-CN when locale is unavailable or invalid (for example C/POSIX)."
      zh-CN: "运行时语言。默认使用系统语言；当系统语言不可用或无效（例如 C/POSIX）时回退到 zh-CN。"
    plugin_download:
      en: "Plugin download settings"
      zh-CN: "插件下载设置"
      enable:
        en: "Enable plugin downloads"
        zh-CN: "启用插件下载功能"
      download:
        en: "Plugin download URL"
        zh-CN: "插件下载地址"
      download_token:
        en: "Plugin download authentication token"
        zh-CN: "插件下载认证 token"
      warning:
        download:
          en: "Use a trusted download server. This URL is used when fetching plugin metadata or plugin packages."
          zh-CN: "请使用可信的下载服务器。该地址会用于获取插件元数据或插件包。"
        download_token:
          en: "This token is sensitive. Do not share generated configuration files publicly without rotating it."
          zh-CN: "该 token 属于敏感信息。公开配置文件前请先更换或移除。"
      migration_notice:
        enable:
          en: "The field name is kept compatible with the old qexed_config crate."
          zh-CN: "字段名保持与旧 qexed_config crate 兼容。"
    server:
      en: "Server settings"
      zh-CN: "服务器设置"
      ip:
        en: "Server listen address"
        zh-CN: "服务器监听地址"
      online:
        en: "Enable public server mode"
        zh-CN: "启用公网服务模式"
      max_player:
        en: "Maximum player count. -1 means unlimited."
        zh-CN: "最大玩家数，-1 表示不限制。"
      display_players:
        en: "Expose player count in status responses"
        zh-CN: "在状态响应中显示玩家数"
      online_mode:
        en: "Enable Mojang online authentication"
        zh-CN: "启用 Mojang 正版验证"
      log_level:
        en: "Server log level: trace, debug, info, warn, error, or off. Defaults to info; use debug/trace only when diagnosing issues."
        zh-CN: "服务端日志级别：trace、debug、info、warn、error 或 off。默认 info；仅在排查问题时使用 debug/trace。"
      mojang_cache_path:
        en: "Directory used to cache Mojang vanilla registry JSON data. Relative paths are resolved from the server working directory. QEXED_MOJANG_CACHE_DIR overrides this value."
        zh-CN: "Mojang 原版注册表 JSON 数据缓存目录。相对路径基于服务端实际运行目录解析；QEXED_MOJANG_CACHE_DIR 环境变量会覆盖此配置。"
      lan_discovery:
        en: "LAN discovery settings"
        zh-CN: "局域网发现设置"
        enable:
          en: "Enable Minecraft LAN discovery broadcasts"
          zh-CN: "启用 Minecraft 局域网发现广播"
        interval_ms:
          en: "LAN discovery broadcast interval in milliseconds"
          zh-CN: "局域网发现广播间隔，单位为毫秒"
      network_compression_threshold:
        en: "Packet compression threshold in bytes"
        zh-CN: "网络数据包压缩阈值，单位为字节"
      proxy:
        en: "Enable proxy forwarding"
        zh-CN: "启用代理转发"
      proxy_protocol:
        en: "Proxy forwarding protocol"
        zh-CN: "代理端协议"
      proxy_server_id:
        en: "Current proxy backend server ID"
        zh-CN: "当前代理后端子服 ID"
      proxy_token:
        en: "Proxy authentication token"
        zh-CN: "代理认证密钥"
      max_port_connections:
        en: "Maximum concurrent TCP connections. 0 is treated as 65535."
        zh-CN: "总 TCP 连接同时在线限制数，0 表示 65535。"
      rate_limit_window_secs:
        en: "Per-IP connection rate limit window in seconds"
        zh-CN: "同 IP 连接频率限制的时间窗口，单位为秒"
      rate_limit_max_attempts:
        en: "Maximum connection attempts allowed per IP within the rate limit window"
        zh-CN: "同 IP 在时间窗口内允许的最大连接次数"
      click_detection:
        en: "Click-rate detection settings"
        zh-CN: "连点器检测设置"
        enable:
          en: "Enable click-rate detection for mining, attacks, interactions, and item drops"
          zh-CN: "启用挖掘、攻击、交互和丢弃物品的连点检测"
        window_ms:
          en: "Detection window in milliseconds"
          zh-CN: "检测窗口，单位毫秒"
        max_clicks:
          en: "Maximum clicks allowed inside the detection window"
          zh-CN: "检测窗口内允许的最大点击次数"
        cancel_actions:
          en: "Cancel the player action after the click-rate threshold is exceeded"
          zh-CN: "超过连点阈值后取消玩家动作"
      motd:
        en: "Random server description lines"
        zh-CN: "服务器描述随机内容"
      code_of_conduct:
        en: "Enable the server entry code-of-conduct prompt. Text files are loaded from config/enable-code-of-conduct/<language>.txt."
        zh-CN: "启用入服准则提示。正文从 config/enable-code-of-conduct/<语言>.txt 读取。"
      world:
        en: "World and spawn settings"
        zh-CN: "世界与出生点设置"
        path:
          en: "World save directory"
          zh-CN: "世界存档目录"
        default_dimension:
          en: "Dimension used when a player joins without saved player data. It may point to any configured dimension; minecraft:overworld is not required."
          zh-CN: "玩家没有存档时默认进入的维度。可以指向任意已配置维度，不要求存在 minecraft:overworld。"
        worlds:
          en: "World storage entries. Each entry maps one dimension to its own save folder."
          zh-CN: "世界存储项。每个条目将一个维度映射到独立存档目录。"
          id:
            en: "Stable world storage id"
            zh-CN: "稳定的世界存储标识"
          dimension:
            en: "Dimension resource key served by this world storage"
            zh-CN: "该世界存储服务的维度资源键"
          dimension_type:
            en: "Dimension type resource key used when entering this dimension"
            zh-CN: "进入该维度时使用的维度类型资源键"
          path:
            en: "Save folder for this dimension"
            zh-CN: "该维度的存档目录"
        read_only:
          en: "Enable read-only world mode. Player world edits are rejected and not written."
          zh-CN: "启用只读世界模式。玩家世界修改会被拒绝，不会写入世界。"
        generator:
          en: "World generator used when no saved chunk exists: empty, vanilla_flat, or vanilla_noise"
          zh-CN: "存档区块不存在时使用的世界生成器：empty、vanilla_flat 或 vanilla_noise"
        generator_preset:
          en: "World generator preset. vanilla_flat uses Minecraft flat_level_generator_preset IDs such as minecraft:classic_flat."
          zh-CN: "世界生成器预设。vanilla_flat 使用 Minecraft flat_level_generator_preset ID，例如 minecraft:classic_flat。"
        seed:
          en: "World generation seed used by vanilla_noise. 0 matches the default Minecraft seed value."
          zh-CN: "vanilla_noise 使用的世界生成种子。0 对应 Minecraft 默认种子值。"
        game_mode:
          en: "Default game mode: survival, creative, adventure, or spectator"
          zh-CN: "默认游戏模式：survival、creative、adventure 或 spectator"
        spawn_protection_radius:
          en: "Spawn protection radius in blocks. 0 disables spawn protection."
          zh-CN: "出生点保护半径，单位为方块。0 表示关闭出生点保护。"
        dimension:
          en: "Default dimension resource key"
          zh-CN: "默认维度资源键"
        dimension_type:
          en: "Default dimension type resource key"
          zh-CN: "默认维度类型资源键"
        view_distance:
          en: "Initial chunk view distance"
          zh-CN: "初始区块视距"
        chunk_load_parallelism:
          en: "Maximum number of chunk build tasks per player"
          zh-CN: "每名玩家同时构建区块的最大任务数"
        chunk_update_delay_ms:
          en: "Delay in milliseconds before applying chunk center updates after player movement. If the player remains in the first neighbor ring, only the new edge chunks and delayed unload chunks are processed."
          zh-CN: "玩家移动后延迟应用区块中心更新的毫秒数。若延迟后玩家仍在原区块第一圈 8 邻域内，只处理新增边缘区块和延迟卸载区块。"
        simulation_distance:
          en: "Initial simulation distance"
          zh-CN: "初始模拟距离"
        light:
          en: "World lighting mode: static, dynamic, or a fixed brightness integer from 0 to 15"
          zh-CN: "世界光照模式：static、dynamic，或 0 到 15 的固定亮度整数"
        light_algorithm:
          en: "World lighting calculation algorithm: fast or ray_trace"
          zh-CN: "世界光照计算算法：fast 或 ray_trace"
        instances:
          en: "Copy-on-write world instances that start from a source dimension and persist changed chunks separately"
          zh-CN: "写时复制世界副本；从源维度读取初始区块，并将变更区块单独持久化"
          id:
            en: "Stable world instance id"
            zh-CN: "稳定的世界副本标识"
          dimension:
            en: "Dimension resource key exposed to players for this instance"
            zh-CN: "该副本暴露给玩家的维度资源键"
          source_dimension:
            en: "Source dimension used when the instance has no copied chunk"
            zh-CN: "副本尚未复制区块时读取的源维度"
          path:
            en: "Storage path for chunks changed by this instance. Empty uses a sanitized dimension folder under the main world path."
            zh-CN: "该副本变更区块的存储路径。留空时使用主世界目录下按维度名清理后的目录。"
          copy_on_write:
            en: "Read unchanged chunks from the source dimension and write changed chunks to this instance path"
            zh-CN: "从源维度读取未变更区块，并将变更区块写入该副本路径"
        ore_pits:
          en: "Runtime mine refill regions. They generate weighted blocks in memory without writing to the save."
          zh-CN: "运行时矿坑补矿区域。按权重生成方块并仅保存在内存中，不写入存档。"
          id:
            en: "Stable ore pit id"
            zh-CN: "稳定的矿坑 ID"
          enable:
            en: "Enable this ore pit refill rule"
            zh-CN: "启用该矿坑补矿规则"
          dimension:
            en: "Dimension resource key for this ore pit"
            zh-CN: "该矿坑所在的维度资源键"
          min_x:
            en: "Minimum X coordinate of the ore pit"
            zh-CN: "矿坑最小 X 坐标"
          max_x:
            en: "Maximum X coordinate of the ore pit"
            zh-CN: "矿坑最大 X 坐标"
          min_y:
            en: "Minimum Y coordinate of the ore pit"
            zh-CN: "矿坑最小 Y 坐标"
          max_y:
            en: "Maximum Y coordinate of the ore pit"
            zh-CN: "矿坑最大 Y 坐标"
          min_z:
            en: "Minimum Z coordinate of the ore pit"
            zh-CN: "矿坑最小 Z 坐标"
          max_z:
            en: "Maximum Z coordinate of the ore pit"
            zh-CN: "矿坑最大 Z 坐标"
          tick_interval_ms:
            en: "Minimum interval between ore refill ticks in milliseconds"
            zh-CN: "矿坑补矿 tick 的最小间隔，单位毫秒"
          initial_refill:
            en: "Try to refill this ore pit immediately on the first runtime tick instead of waiting for tick_interval_ms"
            zh-CN: "首次运行 tick 立即尝试补矿，而不是等待 tick_interval_ms"
          max_blocks_per_tick:
            en: "Maximum number of blocks this ore pit may refill per tick"
            zh-CN: "该矿坑每次 tick 最多补充的方块数量"
          replace_air:
            en: "Allow replacing air-like and replaceable blocks"
            zh-CN: "允许替换空气类和可替换方块"
          replace_generated:
            en: "Allow replacing blocks previously generated by this ore pit"
            zh-CN: "允许替换该矿坑此前生成过的方块"
          only_break_generated:
            en: "Only allow players to break blocks that were generated by this ore pit. Native building blocks in the region stay protected."
            zh-CN: "仅允许玩家破坏该矿坑生成过的方块。区域内原生建筑方块仍受保护。"
          blocks:
            en: "Weighted block pool used by this ore pit"
            zh-CN: "该矿坑使用的加权方块池"
            block:
              en: "Block resource key to generate"
              zh-CN: "要生成的方块资源键"
            weight:
              en: "Selection weight for this block. 0 disables this entry."
              zh-CN: "该方块的选择权重。0 表示禁用该项。"
        edit_regions:
          en: "Runtime-editable world regions. They can bypass read-only mode for minigame areas such as mines without persisting edits to the save."
          zh-CN: "可运行时编辑的世界区域。可用于矿坑等小游戏区域，绕过只读模式且不写入存档。"
          id:
            en: "Stable editable region id"
            zh-CN: "稳定的可编辑区域 ID"
          dimension:
            en: "Dimension resource key for this editable region"
            zh-CN: "该可编辑区域所在的维度资源键"
          min_x:
            en: "Minimum X coordinate of the editable region"
            zh-CN: "可编辑区域最小 X 坐标"
          max_x:
            en: "Maximum X coordinate of the editable region"
            zh-CN: "可编辑区域最大 X 坐标"
          min_y:
            en: "Minimum Y coordinate of the editable region"
            zh-CN: "可编辑区域最小 Y 坐标"
          max_y:
            en: "Maximum Y coordinate of the editable region"
            zh-CN: "可编辑区域最大 Y 坐标"
          min_z:
            en: "Minimum Z coordinate of the editable region"
            zh-CN: "可编辑区域最小 Z 坐标"
          max_z:
            en: "Maximum Z coordinate of the editable region"
            zh-CN: "可编辑区域最大 Z 坐标"
          allow_player_break:
            en: "Allow players to break blocks in this region"
            zh-CN: "允许玩家在该区域破坏方块"
          allow_player_place:
            en: "Allow players to place blocks in this region"
            zh-CN: "允许玩家在该区域放置方块"
          allow_plugin_write:
            en: "Allow plugins to write blocks in this region through the world edit host API"
            zh-CN: "允许插件通过世界编辑 Host API 写入该区域方块"
          runtime_only:
            en: "Keep edits in memory only. Enabled by default for read-only minigame regions."
            zh-CN: "仅在内存中保留修改。只读小游戏区域默认开启。"
        precompiled_chunks:
          en: "Precompiled chunk packet cache. Recommended for read-only worlds because it reuses encoded chunk packets instead of rebuilding complete chunk objects for every player."
          zh-CN: "预编译区块数据包缓存。只读世界推荐启用，它会复用已编码的区块数据包，避免为每个玩家重复构建完整区块对象。"
          enable:
            en: "Enable precompiled chunk packets. Read-only worlds benefit most; writable worlds invalidate affected chunk packets when blocks change."
            zh-CN: "启用预编译区块数据包。只读世界收益最大；可写世界在方块变更时会失效受影响区块的数据包。"
          light:
            en: "Include lighting data in precompiled packets. Disable this when dynamic lighting or externally refreshed lighting should be rebuilt separately."
            zh-CN: "将光照数据也纳入预编译数据包。动态光照或需要外部刷新光照时可关闭，让光照单独重建。"
          max_cached_packets:
            en: "Maximum number of precompiled chunk packets kept in memory. 0 disables the packet-count limit."
            zh-CN: "内存中保留的最大预编译区块数据包数量。0 表示不限制。"
          max_cached_packet_bytes:
            en: "Maximum total bytes used by precompiled chunk packet cache. 0 disables the byte limit. Keep this conservative for worlds where players can travel far."
            zh-CN: "预编译区块数据包缓存可使用的最大总字节数。0 表示不限制字节数。玩家可以跑图的世界应将此值设得保守。"
          block_state_cache_limit:
            en: "Maximum number of individual block states retained for plugin queries when full chunk objects are not kept. 0 disables the block-state query cache."
            zh-CN: "不保留完整区块对象时，为插件查询保留的单方块状态数量上限。0 表示关闭方块状态查询缓存。"
        gpu:
          en: "Experimental GPU calculation settings for world lighting and vanilla_noise post-processing. Unavailable GPU falls back to CPU."
