_fallback_language: zh-CN
_version: 2
autodoc:
  header:
    en: |-
      # Official documentation: https://doc.qexed.com/docs/autodoc/
      # Do not modify fields prefixed with auto_doc_system_
      # Example: auto_doc_system_lang
      # These settings are used for automatically updating the language-specific comments in the config file.
      # However, you can modify fields prefixed with auto_doc_setting_
      # auto_doc_setting_lang: The language for the current file; if empty, the global language is used
      # auto_doc_setting_enable: Enable the AutoDoc feature, which can automatically update comments for fields based on language, version, etc., as well as optional value information
      # Comments below "=======================" will not be modified by the system.
      # Comments above "=======================" will be modified by the system. Please do not edit them.
    zh-CN: |-
      # 官方文档：https://doc.qexed.com/docs/autodoc/
      # 请不要修改 auto_doc_system_ 开头的字段
      # 例如: auto_doc_system_lang
      # 这些设置是用于自动更新配置文件语言自动注释的
      # 但是您可以修改 auto_doc_setting_ 开头的字段
      # auto_doc_setting_lang:当前文件独立语言,若为空则使用全局语言
      # auto_doc_setting_enable:启用AutoDoc功能，该功能可自动为字段根据语言、版本等信息更新注释,以及可选的值等信息
      # 在 "=======================" 下面的注释都不会被系统修改
      # 但是在 "=======================" 上面的注释都会被系统修改，请不要修改
  header-init-example:
    en: |-
      # For example, you can freely modify the content of this line,
      # continue with line breaks,
      # as long as you don't write within AutoDoc and AutoDocHeader blocks.
    zh-CN: |-
      # 例如这一行的内容你就随意修改,
      # 你也可以继续换行等,
      # 只要不是在 AutoDoc 和 AutoDocHeader 中写就行了
  danger:
    en: "DANGER: \n%{text}"
    zh-CN: "高危警告：\n%{text}"
  warning:
    en: "WARNING: \n%{text}"
    zh-CN: "警告：\n%{text}"
  pending_deprecated:
    en: "Pending deprecation: \n%{text}"
    zh-CN: "即将弃用：\n%{text}"
  deprecated:
    en: "Deprecated: \n%{text}"
    zh-CN: "已被弃用：\n%{text}"
  migration:
    en: "Migration notice: \n%{text}"
    zh-CN: "迁移建议：\n%{text}"

qexed_config:
  config:
    server:
      motd1:
        en: "Welcome to Qexed"
        zh-CN: "欢迎使用 Qexed"
      motd2:
        en: "MC server based on Rust"
        zh-CN: "基于Rust的MC服务端"

config:
  qexed:
    version:
      en: "Configuration version"
      zh-CN: "配置版本"
    update_check:
      en: "Enable update checks"
      zh-CN: "启用更新检查"
    language:
      en: "Runtime language. Defaults to detected system locale; falls back to zh-CN when locale is unavailable or invalid (for example C/POSIX)."
      zh-CN: "运行时语言。默认使用系统语言；当系统语言不可用或无效（例如 C/POSIX）时回退到 zh-CN。"
    plugin_download:
      en: "Plugin download settings"
      zh-CN: "插件下载设置"
      enable:
        en: "Enable plugin downloads"
        zh-CN: "启用插件下载功能"
      download:
        en: "Plugin download URL"
        zh-CN: "插件下载地址"
      download_token:
        en: "Plugin download authentication token"
        zh-CN: "插件下载认证 token"
      warning:
        download:
          en: "Use a trusted download server. This URL is used when fetching plugin metadata or plugin packages."
          zh-CN: "请使用可信的下载服务器。该地址会用于获取插件元数据或插件包。"
        download_token:
          en: "This token is sensitive. Do not share generated configuration files publicly without rotating it."
          zh-CN: "该 token 属于敏感信息。公开配置文件前请先更换或移除。"
      migration_notice:
        enable:
          en: "The field name is kept compatible with the old qexed_config crate."
          zh-CN: "字段名保持与旧 qexed_config crate 兼容。"
    server:
      en: "Server settings"
      zh-CN: "服务器设置"
      ip:
        en: "Server listen address"
        zh-CN: "服务器监听地址"
      online:
        en: "Enable public server mode"
        zh-CN: "启用公网服务模式"
      max_player:
        en: "Maximum player count. -1 means unlimited."
        zh-CN: "最大玩家数，-1 表示不限制。"
      display_players:
        en: "Expose player count in status responses"
        zh-CN: "在状态响应中显示玩家数"
      online_mode:
        en: "Enable Mojang online authentication"
        zh-CN: "启用 Mojang 正版验证"
      log_level:
        en: "Server log level: trace, debug, info, warn, error, or off. Defaults to info; use debug/trace only when diagnosing issues."
        zh-CN: "服务端日志级别：trace、debug、info、warn、error 或 off。默认 info；仅在排查问题时使用 debug/trace。"
      lan_discovery:
        en: "LAN discovery settings"
        zh-CN: "局域网发现设置"
        enable:
          en: "Enable Minecraft LAN discovery broadcasts"
          zh-CN: "启用 Minecraft 局域网发现广播"
        interval_ms:
          en: "LAN discovery broadcast interval in milliseconds"
          zh-CN: "局域网发现广播间隔，单位为毫秒"
      network_compression_threshold:
        en: "Packet compression threshold in bytes"
        zh-CN: "网络数据包压缩阈值，单位为字节"
      proxy:
        en: "Enable proxy forwarding"
        zh-CN: "启用代理转发"
      proxy_protocol:
        en: "Proxy forwarding protocol"
        zh-CN: "代理端协议"
      proxy_server_id:
        en: "Current proxy backend server ID"
        zh-CN: "当前代理后端子服 ID"
      proxy_token:
        en: "Proxy authentication token"
        zh-CN: "代理认证密钥"
      max_port_connections:
        en: "Maximum concurrent TCP connections. 0 is treated as 65535."
        zh-CN: "总 TCP 连接同时在线限制数，0 表示 65535。"
      rate_limit_window_secs:
        en: "Per-IP connection rate limit window in seconds"
        zh-CN: "同 IP 连接频率限制的时间窗口，单位为秒"
      rate_limit_max_attempts:
        en: "Maximum connection attempts allowed per IP within the rate limit window"
        zh-CN: "同 IP 在时间窗口内允许的最大连接次数"
      motd:
        en: "Random server description lines"
        zh-CN: "服务器描述随机内容"
      code_of_conduct:
        en: "Enable the server entry code-of-conduct prompt. Text files are loaded from config/enable-code-of-conduct/<language>.txt."
        zh-CN: "启用入服准则提示。正文从 config/enable-code-of-conduct/<语言>.txt 读取。"
      world:
        en: "World and spawn settings"
        zh-CN: "世界与出生点设置"
        path:
          en: "World save directory"
          zh-CN: "世界存档目录"
        read_only:
          en: "Enable read-only world mode. Player world edits are rejected and not written."
          zh-CN: "启用只读世界模式。玩家世界修改会被拒绝，不会写入世界。"
        generator:
          en: "World generator used when no saved chunk exists: empty, vanilla_flat, or vanilla_noise"
          zh-CN: "存档区块不存在时使用的世界生成器：empty、vanilla_flat 或 vanilla_noise"
        generator_preset:
          en: "World generator preset. vanilla_flat uses Minecraft flat_level_generator_preset IDs such as minecraft:classic_flat."
          zh-CN: "世界生成器预设。vanilla_flat 使用 Minecraft flat_level_generator_preset ID，例如 minecraft:classic_flat。"
        seed:
          en: "World generation seed used by vanilla_noise. 0 matches the default Minecraft seed value."
          zh-CN: "vanilla_noise 使用的世界生成种子。0 对应 Minecraft 默认种子值。"
        game_mode:
          en: "Default game mode: survival, creative, adventure, or spectator"
          zh-CN: "默认游戏模式：survival、creative、adventure 或 spectator"
        spawn_protection_radius:
          en: "Spawn protection radius in blocks. 0 disables spawn protection."
          zh-CN: "出生点保护半径，单位为方块。0 表示关闭出生点保护。"
        dimension:
          en: "Default dimension resource key"
          zh-CN: "默认维度资源键"
        dimension_type:
          en: "Default dimension type resource key"
          zh-CN: "默认维度类型资源键"
        view_distance:
          en: "Initial chunk view distance"
          zh-CN: "初始区块视距"
        chunk_load_parallelism:
          en: "Maximum number of chunk build tasks per player"
          zh-CN: "每名玩家同时构建区块的最大任务数"
        chunk_update_delay_ms:
          en: "Delay in milliseconds before applying chunk center updates after player movement. If the player remains in the first neighbor ring, only the new edge chunks and delayed unload chunks are processed."
          zh-CN: "玩家移动后延迟应用区块中心更新的毫秒数。若延迟后玩家仍在原区块第一圈 8 邻域内，只处理新增边缘区块和延迟卸载区块。"
        simulation_distance:
          en: "Initial simulation distance"
          zh-CN: "初始模拟距离"
        light:
          en: "World lighting mode: static, dynamic, or a fixed brightness integer from 0 to 15"
          zh-CN: "世界光照模式：static、dynamic，或 0 到 15 的固定亮度整数"
        light_algorithm:
          en: "World lighting calculation algorithm: fast or ray_trace"
          zh-CN: "世界光照计算算法：fast 或 ray_trace"
        precompiled_chunks:
          en: "Precompiled chunk packet cache. Recommended for read-only worlds because it reuses encoded chunk packets instead of rebuilding complete chunk objects for every player."
          zh-CN: "预编译区块数据包缓存。只读世界推荐启用，它会复用已编码的区块数据包，避免为每个玩家重复构建完整区块对象。"
          enable:
            en: "Enable precompiled chunk packets. Read-only worlds benefit most; writable worlds invalidate affected chunk packets when blocks change."
            zh-CN: "启用预编译区块数据包。只读世界收益最大；可写世界在方块变更时会失效受影响区块的数据包。"
          light:
            en: "Include lighting data in precompiled packets. Disable this when dynamic lighting or externally refreshed lighting should be rebuilt separately."
            zh-CN: "将光照数据也纳入预编译数据包。动态光照或需要外部刷新光照时可关闭，让光照单独重建。"
          max_cached_packets:
            en: "Maximum number of precompiled chunk packets kept in memory. 0 disables the packet-count limit."
            zh-CN: "内存中保留的最大预编译区块数据包数量。0 表示不限制。"
          max_cached_packet_bytes:
            en: "Maximum total bytes used by precompiled chunk packet cache. 0 disables the byte limit. Keep this conservative for worlds where players can travel far."
            zh-CN: "预编译区块数据包缓存可使用的最大总字节数。0 表示不限制字节数。玩家可以跑图的世界应将此值设得保守。"
          block_state_cache_limit:
            en: "Maximum number of individual block states retained for plugin queries when full chunk objects are not kept. 0 disables the block-state query cache."
            zh-CN: "不保留完整区块对象时，为插件查询保留的单方块状态数量上限。0 表示关闭方块状态查询缓存。"
        gpu:
          en: "Experimental GPU calculation settings for world lighting and vanilla_noise post-processing. Unavailable GPU falls back to CPU."
          zh-CN: "世界光照与 vanilla_noise 后处理 GPU 计算设置（实验性）。GPU 不可用时回退 CPU。"
          enable:
            en: "Enable experimental GPU world calculation. Disabled uses CPU; unavailable GPU falls back to CPU."
            zh-CN: "启用实验性 GPU 世界计算。关闭时使用 CPU；GPU 不可用时回退 CPU。"
          device:
            en: "GPU selector: discrete, integrated, cpu, auto, or a numeric adapter index"
            zh-CN: "GPU 选择器：discrete、integrated、cpu、auto，或数字适配器索引"
        spawn:
          en: "Player spawn position and rotation"
          zh-CN: "玩家出生坐标与朝向"
          x:
            en: "Spawn X coordinate"
            zh-CN: "出生点 X 坐标"
          y:
            en: "Spawn Y coordinate"
            zh-CN: "出生点 Y 坐标"
          z:
            en: "Spawn Z coordinate"
            zh-CN: "出生点 Z 坐标"
          yaw:
            en: "Spawn yaw"
            zh-CN: "出生点水平朝向"
          pitch:
            en: "Spawn pitch"
            zh-CN: "出生点俯仰角"
      player_data:
        en: "Player save data settings"
        zh-CN: "玩家存档设置"
        enable:
          en: "Enable player data saving and loading"
          zh-CN: "启用玩家数据保存与加载"
        engine:
          en: "Player data storage engine. vanilla uses local playerdata files in the world folder; mongodb stores player data in MongoDB; mysql stores player data in a MySQL table."
          zh-CN: "玩家数据存储引擎。vanilla 使用世界目录下的本地 playerdata 文件；mongodb 使用 MongoDB 集合存储；mysql 使用 MySQL 数据表存储。"
        collection:
          en: "MongoDB collection name for player data"
          zh-CN: "MongoDB 玩家数据集合名"
        table:
          en: "MySQL table name for player data"
          zh-CN: "MySQL 玩家数据表名"
        mongodb:
          en: "MongoDB settings for player data"
          zh-CN: "玩家数据 MongoDB 设置"
        mysql:
          en: "MySQL settings for player data"
          zh-CN: "玩家数据 MySQL 设置"
      player_messages:
        en: "Player join and leave announcement settings"
        zh-CN: "玩家进退服提示设置"
        enable:
          en: "Enable player join and leave announcements"
          zh-CN: "启用玩家进服和退服提示"
        join:
          en: "Join announcement template. Use {player} as the player name placeholder."
          zh-CN: "玩家进服提示模板，使用 {player} 作为玩家名占位符"
        leave:
          en: "Leave announcement template. Use {player} as the player name placeholder."
          zh-CN: "玩家退服提示模板，使用 {player} 作为玩家名占位符"
      player_audit:
        en: "Player audit settings"
        zh-CN: "玩家审计设置"
        enable:
          en: "Enable player action auditing"
          zh-CN: "启用玩家行为审计"
        storage:
          en: "Audit storage target: file, stdout, or file_and_stdout"
          zh-CN: "审计存储目标：file、stdout 或 file_and_stdout"
        file_path:
          en: "Audit log file path used by file/file_and_stdout storage"
          zh-CN: "file/file_and_stdout 存储下使用的审计日志文件路径"
        events:
          en: "Per-event audit switches"
          zh-CN: "按事件维度的审计开关"
          block_place:
            en: "Audit block placement events"
            zh-CN: "审计方块放置事件"
          block_break:
            en: "Audit block break events"
            zh-CN: "审计方块破坏事件"
          item_switch:
            en: "Audit held-item switch events"
            zh-CN: "审计手持物品切换事件"
          command:
            en: "Audit player command events"
            zh-CN: "审计玩家指令事件"
      content_filter:
        en: "Chat content filter settings"
        zh-CN: "聊天内容审核设置"
        enable:
          en: "Enable chat content filtering. Disabled by default."
          zh-CN: "启用聊天内容审核，默认关闭"
        engine:
          en: "Content filter engine: fixed, knowledge, or api"
          zh-CN: "内容审核引擎：fixed、knowledge 或 api"
        words:
          en: "Inline sensitive words used by fixed and knowledge engines"
          zh-CN: "fixed 和 knowledge 引擎使用的内置敏感词"
        knowledge_path:
          en: "Sensitive-word knowledge base file path. One word per line; lines starting with # are ignored."
          zh-CN: "敏感词知识库文件路径，每行一个词，# 开头的行会被忽略"
        api_url:
          en: "HTTP API URL for external content filtering. The server posts JSON { text }."
          zh-CN: "外部内容审核 HTTP API 地址，服务端发送 JSON { text }"
        api_token:
          en: "Bearer token for the content filter API"
          zh-CN: "内容审核 API Bearer token"
        replacement:
          en: "Replacement text for matched words"
          zh-CN: "命中敏感词后的替换文本"
        block_message:
          en: "Message shown to the player when the API blocks chat"
          zh-CN: "API 拦截聊天时发送给玩家的提示"
      permissions:
        en: "Command permission settings. The permission system is always active; the local engine has no database dependency."
        zh-CN: "指令权限设置。权限系统始终启用；local 引擎不依赖数据库。"
        engine:
          en: "Permission storage engine: local or luckperms_mysql."
          zh-CN: "权限存储引擎：local 或 luckperms_mysql。"
        local_path:
          en: "Local permission file path used by the local engine"
          zh-CN: "local 引擎使用的本地权限文件路径"
        table_prefix:
          en: "LuckPerms SQL table prefix, usually luckperms_"
          zh-CN: "LuckPerms SQL 表前缀，通常为 luckperms_"
        server:
          en: "LuckPerms server context used by Qexed. global accepts globally assigned permissions."
          zh-CN: "Qexed 使用的 LuckPerms server 上下文。global 表示接受全局权限。"
        world:
          en: "LuckPerms world context used by Qexed. global accepts globally assigned permissions."
          zh-CN: "Qexed 使用的 LuckPerms world 上下文。global 表示接受全局权限。"
        default_group:
          en: "Group inherited by players with no saved primary group"
          zh-CN: "没有保存主组的玩家默认继承的组"
        allow_by_default:
          en: "Allow commands when no matching permission node is found"
          zh-CN: "找不到匹配权限节点时是否允许执行指令"
        denied_message:
          en: "Message shown when a command is denied"
          zh-CN: "指令被拒绝时发送给玩家的提示"
        mysql:
          en: "MySQL settings for LuckPerms storage"
          zh-CN: "LuckPerms 存储使用的 MySQL 设置"
      resource_pack:
        en: "Server resource pack settings"
        zh-CN: "服务器资源包设置"
        enable:
          en: "Enable server resource pack delivery during the configuration phase"
          zh-CN: "启用配置阶段服务端资源包下发"
        source:
          en: "Resource pack source: url, local, or object_storage. Local files are served by Qexed over HTTP."
          zh-CN: "资源包来源：url、local 或 object_storage。本地文件会由 Qexed 通过 HTTP 提供下载。"
        id:
          en: "Resource pack UUID used by the client to track this pack"
          zh-CN: "资源包 UUID，客户端使用它跟踪该资源包"
        url:
          en: "Resource pack download URL. Supports public URLs and full presigned URLs. Leave empty to disable sending the pack."
          zh-CN: "资源包下载地址。支持公开 URL 和完整预签名 URL。为空时不会发送资源包。"
        path:
          en: "Local resource pack zip path used when source is local"
          zh-CN: "source 为 local 时使用的本地资源包 zip 路径"
        download_bind:
          en: "HTTP bind address for serving the local resource pack"
          zh-CN: "本地资源包 HTTP 下载服务监听地址"
        download_host:
          en: "Public host or URL used by clients to download the local resource pack. Empty uses the login host."
          zh-CN: "客户端下载本地资源包时使用的公网主机名或 URL。为空时使用登录地址。"
        object_storage:
          en: "Object storage and CDN settings used when source is object_storage"
          zh-CN: "source 为 object_storage 时使用的对象存储与 CDN 设置"
          provider:
            en: "Object storage/CDN provider hint: generic, tencent_cos, tencent_eo, huawei_obs, huawei_cdn, aliyun_oss, or aws_s3"
            zh-CN: "对象存储/CDN 提供商提示：generic、tencent_cos、tencent_eo、huawei_obs、huawei_cdn、aliyun_oss 或 aws_s3"
          public_base_url:
            en: "Public CDN or object URL prefix. Prefer this for Tencent Cloud EdgeOne, CDN acceleration domains, and custom domains."
            zh-CN: "公网 CDN 或对象 URL 前缀。腾讯云 EdgeOne、CDN 加速域名和自定义域名优先使用此字段。"
          endpoint:
            en: "Object storage endpoint host or URL used when public_base_url is empty"
            zh-CN: "public_base_url 为空时使用的对象存储 endpoint 主机名或 URL"
          bucket:
            en: "Object storage bucket name used when public_base_url is empty"
            zh-CN: "public_base_url 为空时使用的对象存储 bucket 名称"
          object_key:
            en: "Object key/path of the resource pack zip in the bucket or under public_base_url"
            zh-CN: "资源包 zip 在 bucket 或 public_base_url 下的对象键/路径"
          force_path_style:
            en: "Use path-style URL: endpoint/bucket/object_key. Disabled uses virtual-host style: bucket.endpoint/object_key."
            zh-CN: "使用路径风格 URL：endpoint/bucket/object_key。关闭时使用虚拟主机风格：bucket.endpoint/object_key。"
        hash:
          en: "Resource pack SHA-1 hash. Leave empty if the pack should not be hash-checked."
          zh-CN: "资源包 SHA-1 哈希。为空时客户端不按哈希校验。"
        required:
          en: "Require players to accept and download the resource pack"
          zh-CN: "要求玩家接受并下载该资源包"
        prompt:
          en: "Optional prompt shown by the client before applying the resource pack"
          zh-CN: "客户端应用资源包前显示的可选提示"
        disconnect_message:
          en: "Disconnect message used when a required resource pack is rejected or fails"
          zh-CN: "强制资源包被拒绝或下载失败时的断开提示"
      entities:
        en: "Static entity and NPC settings. AI is not enabled for these entities."
        zh-CN: "静态实体与 NPC 设置。这些实体暂不启用 AI。"
        enable:
          en: "Enable configured static entities and NPCs"
          zh-CN: "启用配置中的静态实体与 NPC"
        dimension:
          en: "Dimension where configured static entities are visible"
          zh-CN: "配置中的静态实体可见的维度"
        list:
          en: "Configured static entity and NPC list"
          zh-CN: "配置的静态实体与 NPC 列表"
          id:
            en: "Stable entity identifier used by Qexed"
            zh-CN: "Qexed 使用的稳定实体标识"
          kind:
            en: "Entity kind: entity, npc, or hologram. NPCs are spawned as player entities; holograms use text display entities."
            zh-CN: "实体类型：entity、npc 或 hologram。NPC 会以玩家实体生成，hologram 使用文本展示实体。"
          entity_type:
            en: "Minecraft entity type resource key, for example minecraft:armor_stand or minecraft:villager"
            zh-CN: "Minecraft 实体类型资源键，例如 minecraft:armor_stand 或 minecraft:villager"
