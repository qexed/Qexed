          zh-CN: "关闭正版验证会允许离线用户名，并增加身份冒用风险。"
        proxy_token:
          en: "Keep this token private and rotate it if it is exposed."
          zh-CN: "请妥善保管该密钥；一旦泄露请立即更换。"
  qexed_warden:
    version:
      en: "Warden configuration version"
      zh-CN: "典狱长配置版本"
    data:
