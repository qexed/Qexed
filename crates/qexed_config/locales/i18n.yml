          zh-CN: "侧边栏计分板标题"
        lines:
          en: "Sidebar scoreboard lines displayed from top to bottom"
          zh-CN: "侧边栏计分板从上到下显示的行"
      favicon:
        en: "Server icon data URI"
        zh-CN: "服务器图标 data URI"
      warning:
        online:
          en: "When disabled, clients may be accepted without the expected public-server checks."
          zh-CN: "关闭后，客户端可能不会经过预期的公网服务检查。"
