_fallback_language: zh-CN
_version: 2
autodoc:
  header:
    en: |-
      # Official documentation: https://www.qexed.com/doc?path=/qexed/doc/autodoc
      # Do not modify fields prefixed with auto_doc_system_
      # Example: auto_doc_system_lang
      # These settings are used for automatically updating the language-specific comments in the config file.
      # However, you can modify fields prefixed with auto_doc_setting_
      # auto_doc_setting_lang: The language for the current file; if empty, the global language is used
      # auto_doc_setting_enable: Enable the AutoDoc feature, which can automatically update comments for fields based on language, version, etc., as well as optional value information
      # Comments below "=======================" will not be modified by the system.
      # Comments above "=======================" will be modified by the system. Please do not edit them.
    zh-CN: |-
      # 官方文档：https://www.qexed.com/doc?path=/qexed/doc/autodoc
      # 请不要修改 auto_doc_system_ 开头的字段
      # 例如: auto_doc_system_lang
      # 这些设置是用于自动更新配置文件语言自动注释的
      # 但是您可以修改 auto_doc_setting_ 开头的字段
      # auto_doc_setting_lang:当前文件独立语言,若为空则使用全局语言
      # auto_doc_setting_enable:启用AutoDoc功能，该功能可自动为字段根据语言、版本等信息更新注释,以及可选的值等信息
      # 在 "=======================" 下面的注释都不会被系统修改
      # 但是在 "=======================" 上面的注释都会被系统修改，请不要修改
  header-init-example:
    en: |-
      # For example, you can freely modify the content of this line,
      # continue with line breaks,
      # as long as you don't write within AutoDoc and AutoDocHeader blocks.
    zh-CN: |-
      # 例如这一行的内容你就随意修改,
      # 你也可以继续换行等,
      # 只要不是在 AutoDoc 和 AutoDocHeader 中写就行了
  danger:
    en: "DANGER: \n%{text}"
    zh-CN: "高危警告：\n%{text}"
  warning:
    en: "WARNING: \n%{text}"
    zh-CN: "警告：\n%{text}"
  pending_deprecated:
    en: "Pending deprecation: \n%{text}"
    zh-CN: "即将弃用：\n%{text}"
  deprecated:
    en: "Deprecated: \n%{text}"
    zh-CN: "已被弃用：\n%{text}"
  migration:
    en: "Migration notice: \n%{text}"
    zh-CN: "迁移建议：\n%{text}"

qexed_config:
  config:
    server:
      motd1:
        en: "Welcome to Qexed"
        zh-CN: "欢迎使用 Qexed"
      motd2:
        en: "MC server based on Rust"
        zh-CN: "基于Rust的MC服务端"

config:
  qexed:
    version:
      en: "Configuration version"
      zh-CN: "配置版本"
    update_check:
      en: "Enable update checks"
      zh-CN: "启用更新检查"
    language:
      en: "Runtime language"
      zh-CN: "运行时语言"
    plugin_download:
      en: "Plugin download settings"
      zh-CN: "插件下载设置"
      enable:
        en: "Enable plugin downloads"
        zh-CN: "启用插件下载功能"
      download:
        en: "Plugin download URL"
        zh-CN: "插件下载地址"
      download_token:
        en: "Plugin download authentication token"
        zh-CN: "插件下载认证 token"
      warning:
        download:
          en: "Use a trusted download server. This URL is used when fetching plugin metadata or plugin packages."
          zh-CN: "请使用可信的下载服务器。该地址会用于获取插件元数据或插件包。"
        download_token:
          en: "This token is sensitive. Do not share generated configuration files publicly without rotating it."
          zh-CN: "该 token 属于敏感信息。公开配置文件前请先更换或移除。"
      migration_notice:
        enable:
          en: "The field name is kept compatible with the old qexed_config crate."
          zh-CN: "字段名保持与旧 qexed_config crate 兼容。"
    server:
      en: "Server settings"
      zh-CN: "服务器设置"
      ip:
        en: "Server listen address"
        zh-CN: "服务器监听地址"
      online:
        en: "Enable public server mode"
        zh-CN: "启用公网服务模式"
      max_player:
        en: "Maximum player count. -1 means unlimited."
        zh-CN: "最大玩家数，-1 表示不限制。"
      display_players:
        en: "Expose player count in status responses"
        zh-CN: "在状态响应中显示玩家数"
      online_mode:
        en: "Enable Mojang online authentication"
        zh-CN: "启用 Mojang 正版验证"
      lan_discovery:
        en: "LAN discovery settings"
        zh-CN: "局域网发现设置"
        enable:
          en: "Enable Minecraft LAN discovery broadcasts"
          zh-CN: "启用 Minecraft 局域网发现广播"
        interval_ms:
          en: "LAN discovery broadcast interval in milliseconds"
          zh-CN: "局域网发现广播间隔，单位为毫秒"
      network_compression_threshold:
        en: "Packet compression threshold in bytes"
        zh-CN: "网络数据包压缩阈值，单位为字节"
      proxy:
        en: "Enable proxy forwarding"
        zh-CN: "启用代理转发"
      proxy_protocol:
        en: "Proxy forwarding protocol"
        zh-CN: "代理端协议"
      proxy_token:
        en: "Proxy authentication token"
        zh-CN: "代理认证密钥"
      max_port_connections:
        en: "Maximum concurrent TCP connections. 0 is treated as 65535."
        zh-CN: "总 TCP 连接同时在线限制数，0 表示 65535。"
      rate_limit_window_secs:
        en: "Per-IP connection rate limit window in seconds"
        zh-CN: "同 IP 连接频率限制的时间窗口，单位为秒"
      rate_limit_max_attempts:
        en: "Maximum connection attempts allowed per IP within the rate limit window"
        zh-CN: "同 IP 在时间窗口内允许的最大连接次数"
      motd:
        en: "Random server description lines"
        zh-CN: "服务器描述随机内容"
      code_of_conduct:
        en: "Enable the server entry code-of-conduct prompt. Text files are loaded from config/enable-code-of-conduct/<language>.txt."
        zh-CN: "启用入服准则提示。正文从 config/enable-code-of-conduct/<语言>.txt 读取。"
      world:
        en: "World and spawn settings"
        zh-CN: "世界与出生点设置"
        path:
          en: "World save directory"
          zh-CN: "世界存档目录"
        read_only:
          en: "Enable read-only world mode. Player world edits are rejected and not written."
          zh-CN: "启用只读世界模式。玩家世界修改会被拒绝，不会写入世界。"
        generator:
          en: "World generator used when no saved chunk exists: empty, vanilla_flat, or vanilla_noise"
          zh-CN: "存档区块不存在时使用的世界生成器：empty、vanilla_flat 或 vanilla_noise"
        generator_preset:
          en: "World generator preset. vanilla_flat uses Minecraft flat_level_generator_preset IDs such as minecraft:classic_flat."
          zh-CN: "世界生成器预设。vanilla_flat 使用 Minecraft flat_level_generator_preset ID，例如 minecraft:classic_flat。"
        seed:
          en: "World generation seed used by vanilla_noise. 0 matches the default Minecraft seed value."
          zh-CN: "vanilla_noise 使用的世界生成种子。0 对应 Minecraft 默认种子值。"
        game_mode:
          en: "Default game mode: survival, creative, adventure, or spectator"
          zh-CN: "默认游戏模式：survival、creative、adventure 或 spectator"
        spawn_protection_radius:
          en: "Spawn protection radius in blocks. 0 disables spawn protection."
          zh-CN: "出生点保护半径，单位为方块。0 表示关闭出生点保护。"
        dimension:
          en: "Default dimension resource key"
          zh-CN: "默认维度资源键"
        dimension_type:
          en: "Default dimension type resource key"
          zh-CN: "默认维度类型资源键"
        view_distance:
          en: "Initial chunk view distance"
          zh-CN: "初始区块视距"
        chunk_load_parallelism:
          en: "Maximum number of chunk build tasks per player"
          zh-CN: "每名玩家同时构建区块的最大任务数"
        simulation_distance:
          en: "Initial simulation distance"
          zh-CN: "初始模拟距离"
        light:
          en: "World lighting mode: static, dynamic, or a fixed brightness integer from 0 to 15"
          zh-CN: "世界光照模式：static、dynamic，或 0 到 15 的固定亮度整数"
        light_algorithm:
          en: "World lighting calculation algorithm: fast or ray_trace"
          zh-CN: "世界光照计算算法：fast 或 ray_trace"
        gpu:
          en: "Experimental GPU calculation settings for world lighting and vanilla_noise post-processing. Unavailable GPU falls back to CPU."
          zh-CN: "世界光照与 vanilla_noise 后处理 GPU 计算设置（实验性）。GPU 不可用时回退 CPU。"
          enable:
            en: "Enable experimental GPU world calculation. Disabled uses CPU; unavailable GPU falls back to CPU."
            zh-CN: "启用实验性 GPU 世界计算。关闭时使用 CPU；GPU 不可用时回退 CPU。"
          device:
            en: "GPU selector: discrete, integrated, cpu, auto, or a numeric adapter index"
            zh-CN: "GPU 选择器：discrete、integrated、cpu、auto，或数字适配器索引"
        spawn:
          en: "Player spawn position and rotation"
          zh-CN: "玩家出生坐标与朝向"
          x:
            en: "Spawn X coordinate"
            zh-CN: "出生点 X 坐标"
          y:
            en: "Spawn Y coordinate"
            zh-CN: "出生点 Y 坐标"
          z:
            en: "Spawn Z coordinate"
            zh-CN: "出生点 Z 坐标"
          yaw:
            en: "Spawn yaw"
            zh-CN: "出生点水平朝向"
          pitch:
            en: "Spawn pitch"
            zh-CN: "出生点俯仰角"
      player_data:
        en: "Player save data settings"
        zh-CN: "玩家存档设置"
        enable:
          en: "Enable player data saving and loading"
          zh-CN: "启用玩家数据保存与加载"
        engine:
          en: "Player data storage engine: vanilla, mongodb, or mysql"
          zh-CN: "玩家数据存储引擎：vanilla、mongodb 或 mysql"
        collection:
