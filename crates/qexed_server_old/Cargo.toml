[package]
name = "qexed_server"
version = "0.1.0"
edition = "2024"
description = "Minecraft server connection layer: async packet framing, login, configuration, minimal play. Keeps the qexed binary lean."
license = "MIT"
repository = "https://github.com/qexed/Qexed"

[dependencies]
qexed_packet.workspace = true
qexed_protocol.workspace = true
bytes.workspace = true
flate2.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v3"] }
qexed_nbt.workspace = true

openssl = "0.10"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

sha1 = "0.10"

hex = "0.4"

base64 = "0.22"

rand = "0.8"

serde.workspace = true

anyhow.workspace = true

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }