[package]
name = "qexed_play"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono.workspace = true
rand.workspace = true
qexed_mojang_data.workspace = true
qexed_config.workspace = true
qexed_config_macros.workspace = true
qexed_doc.workspace = true
qexed_doc_macros.workspace = true
qexed_log.workspace = true
qexed_language.workspace = true
qexed_protocol.workspace = true
qexed_packet.workspace = true
qexed_nbt.workspace = true
# qexed_world：play-core 区块经 context::WorldChunkSource trait 注入不直接依赖；
# play-gameplay 的 redstone/enchanting/chat 需要 WorldRulesManager（gamerule/time 命令与
# 光照模式规则），方块状态注册表则走 world_access + qexed_mojang_data（避免 pub(crate) 边界）。
qexed_world.workspace = true
qexed_entities.workspace = true
qexed_player.workspace = true
qexed_plugins.workspace = true
qexed_connection.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
bytes.workspace = true
uuid.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
flate2.workspace = true

[dev-dependencies]
tempfile = "3"
