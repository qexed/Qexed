[package]
name = "qexed_connection"
version = "0.1.0"
edition = "2024"

[dependencies]
qexed_config.workspace = true
qexed_log.workspace = true
qexed_language.workspace = true
qexed_mojang_data.workspace = true
qexed_protocol.workspace = true
qexed_packet.workspace = true
qexed_nbt.workspace = true
qexed_config_macros.workspace = true
qexed_doc.workspace = true
qexed_doc_macros.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-stream.workspace = true
log.workspace = true
bytes.workspace = true
rand.workspace = true
sha1.workspace = true
hex.workspace = true
base64.workspace = true

# 加密：传输层 AES-128-CFB8 用 RustCrypto（aes+cfb8）；认证 RSA 与 Velocity HMAC-SHA256 用 openssl（vendored）
aes.workspace = true
cfb8.workspace = true
openssl.workspace = true

flate2.workspace = true
uuid.workspace = true

# Mojang 会话服务器 HTTP 客户端（auth 需要）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

cipher = { version = "0.4", features = ["block-padding"] }

sha2 = "0.10"
