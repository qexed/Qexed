[qexed_update_check.Skip_the_local_version_update_check]
en = "Skip the local version update check"
zh-CN = "跳过本地版本更新检查"
[qexed_update_check.find_new_version]
en = "A new version is available: %{new_version} (Current: %{current_version})"
zh-CN = "发现新版本: %{new_version} (当前: %{current_version})"
[qexed_update_check.failed_to_parse_version_information]
