_fallback_language: zh-CN
_version: 2

qexed:
  error_exit:
    en: "Failed: %{err}"
    zh-CN: "错误: %{err}"
  system_running:
    en: Running %{system} %{version}(%{arch})
    zh-CN: "运行在 %{system} %{version}(%{arch})"
  loading:
    en: "Loading %{name} %{tag}-%{build_type}%{branch}(%{commit_hash}) for Minecraft %{mc_version}"
    zh-CN: "正在加载 %{name} %{tag}-%{build_type}%{branch}(%{commit_hash})（Minecraft %{mc_version}）"
  address_in_use:
    en: "Address is already in use: %{ip}"
    zh-CN: "地址已被占用: %{ip}"
  bind_failed:
    en: "Server failed to bind IP: %{error}"
    zh-CN: "服务器绑定IP失败: %{error}"
  listen_ip:
    en: "Listening to IP address: %{ip}"
    zh-CN: "监听IP地址: %{ip}"
  log_init_finish:
    en: "Logging system initialized"
    zh-CN: "日志系统初始化完成"
  minecraft_warning:
    hacker_risk:
      en: "While this makes the game possible to play without internet access, it also opens up the ability for hackers to connect with any username they choose."
      zh-CN: "虽然这使得游戏可以在没有互联网连接的情况下进行，但也让黑客能够以任何他们选择的用户名进行连接。"
    no_authentication:
      en: "The server will make no attempt to authenticate usernames. Beware."
      zh-CN: "服务器将不会尝试验证用户名。请注意。"
    offline_mode:
      en: "**** SERVER IS RUNNING IN OFFLINE/INSECURE MODE! ****"
      zh-CN: "**** 服务器正运行在离线/不安全模式下！****"
    set_online_mode:
      en: 'To change this, set "server.online-mode" to "true" in the config/qexed.toml file.'
      zh-CN: '要更改此设置，请在 config/qexed.toml 文件中将 "server.online-mode" 设置为 "true"。'
  new_tcp_connection:
    en: "New TCP connection: %{addr}"
    zh-CN: "新的TCP连接: %{addr}"
  plugin_update_check_error:
    en: "Plugin update check failed. Error reason: %{err}"
    zh-CN: "插件更新检查失败，错误原因: %{err}"
  plugin_update_check_error_by_false:
    en: "Plugin update check failed. Please refer to the log for the error reason."
    zh-CN: "插件更新检查失败，错误原因请查看日志。"
  modern_init_finish:
    en: "modern init is finish."
    zh-CN: "模块启动完成"
  modern_init_start:
    en: "start init modern"
    zh-CN: "模块开始启动"

qexed_log:
  modern:
    global:
      en: "Global"
      zh-CN: "全局"
    log:
      en: "Log"
      zh-CN: "日志"
    qexed:
      en: "Main"
      zh-CN: "主程序"
    qexed_plugin_manage:
      en: "Plugin Manage"
      zh-CN: "插件管理"
    qexed_tcp_connect:
      en: "Tcp Connect"
      zh-CN: "Tcp 连接"
    qexed_update_check:
      en: "Update Check"
      zh-CN: "更新检查"
    qexed_warden:
      en: "Warden"
      zh-CN: "典狱长"
    qexed_ip_connection_speed_test:
      en: "IP Speed Test"
      zh-CN: "IP速率检测"
    qexed_wasm_runtime:
      en: "Plugin RunTime"
      zh-CN: "插件运行环境"
    qexed_players:
      en: "Players"
      zh-CN: "玩家管理"
    qexed_packet_split:
      en: "Packet Split"
      zh-CN: "数据包分流"
qexed_ip_connection_speed_test:
  simple_warning:
    en: "**** The current module is running under the simple engine! ****"
    zh-CN: "**** 当前模块正运行在简易引擎下！****"
  simple_warning2:
    en: "Running in Simple Mode. IP rate data is temporary and will be cleared on restart. For persistence, switch to a standard engine."
    zh-CN: "当前运行在简易引擎下。IP速率数据为临时存储，重启后将被清除。如需持久化，请切换至标准引擎。"
  engine_incompatible:
    en: "IP速率检测当前版本仅兼容 Simple 与 Pika(Redis) 引擎"
    zh-CN: "IP速率检测当前版本仅兼容 Simple 与 Pika(Redis) 引擎"
  connect_to_speek:
    en: "[%{ip}] is making connections too rapidly."
    zh-CN: "[%{ip}] 连接速率过快"
qexed_plugin_manage:
  load_plugin_config_start:
    en: "Loading plugin configurations"
    zh-CN: "开始读取插件配置"
  loading_plugin_config_info:
    en: "Loading plugin: %{name}, version: %{version}"
    zh-CN: "读取插件:%{name},版本:%{version}"
  load_plugin_config_finish:
    en: "Finished loading plugin configurations"
    zh-CN: "读取插件配置完成"
  download_skip:
    en: "Plugin download check skipped. If you need to use it, please read: %{url}"
    zh-CN: "插件下载检查跳过，如需使用请阅读: %{url}"
  loading_plugin_config_err:
    en: "An error occurred while reading the configuration file of the plugin at path %{path}: %{err}"
    zh-CN: "读取插件 %{path} 配置文件报错：%{err}"
  load_plugin_config_finish:
    en: "Plugin configuration loaded"
    zh-CN: "插件配置加载完成"
  duplicate_plugins_warning:
    en: "Duplicate plugin name found: %{name}"
    zh-CN: "存在多个冲突同名插件:%{name}"
  check_plugins_instruction:
    en: "Please check the following plugins and keep one version"
    zh-CN: "请检查如下插件并保留其中一个版本"
  plugin_version_path:
    en: "Version: %{version}, Path:\"%{path}\""
    zh-CN: "版本:%{version},路径:\"%{path}\""
  unknown_path:
    en: "Unknown"
    zh-CN: "未知"
  plugin_circular_dependency:
    en: "Plugin circular dependency detected, removing conflicting plugins."
    zh-CN: "检测到插件循环依赖,移除冲突插件中"
  removed_plugins:
    en: "Removed plugins:"
    zh-CN: "移除的插件："
  detected_circular_dependency_path:
    en: "Detected circular dependency path:"
    zh-CN: "检测到的循环依赖路径："
  plugin_version_decode_err:
    en: "Plugin [%{name}] version resolution failed. Please refer to the documentation at %{url}. Error: %{err}"
    zh-CN: "插件[%{name}]版本解析失败,请阅读文档%{url},错误:%{err}"
  dependency_conflict:
    en: "The dependency of plugin [%{name}] is in conflict: %{conflicts} appears simultaneously in both 'depend' and 'softdepend' sections."
    zh-CN: "插件[%{name}]的依赖项冲突: %{conflicts} 同时出现在depend和softdepend中"
qexed_update_check:
  skip_local_version_check:
    en: "Skip the local version update check"
    zh-CN: "跳过本地版本更新检查"
  failed_to_parse_version_information:
    en: "Unable to parse version information: %{err}"
    zh-CN: "无法解析版本信息:%{err}"
  find_new_version:
    en: "A new version is available: %{new_version} (Current: %{current_version})"
    zh-CN: "发现新版本: %{new_version} (当前: %{current_version})"
  github_api_error:
    en: "GitHub API returned an error status code: %{err}"
    zh-CN: "GitHub API 返回错误状态码: %{err}"
  no_official_version:
    en: "The repository has not released any official version yet (404 Not Found)"
    zh-CN: "仓库尚未发布任何正式版本（404 Not Found）"
  version_check_failed:
    en: "Version check failed: %{err}"
    zh-CN: "版本检查失败: %{err}"
# 通用翻译
config_init_finish:
  en: "Config Load Finish"
  zh-CN: "配置文件初始化完成"
config_load_error:
  en: "Failed to load config file: %{err}"
  zh-CN: "配置文件读取报错: %{err}"


